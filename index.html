<!DOCTYPE html>
<html>
<head>
<title>For Mariam ❤️</title>

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  background:linear-gradient(to bottom, #ffd6e7, #ffc2d1);
}

/* 💗 Center Card */
.container{
  background:white;
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  position:relative;
}

/* 🧸 Teddy */
.teddy{
  width:150px;
  margin-bottom:20px;
}

/* ❤️ Text */
h1{
  font-size:36px;
  color:#8B0000; /* dark red */
  margin-bottom:30px;
}

button{
  padding:15px 25px;
  font-size:18px;
  margin:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:black;
  color:white;
  position:absolute;
}

/* Floating hearts */
.heart{
  position:absolute;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<div class="container">

<!-- 🧸 Teddy Bear PNG (replace link with your own if you want) -->
<img src="https://i.imgur.com/6QJjYQK.png" class="teddy">

<h1>Mariam 💖<br>Will you be my Valentine?</h1>

<button id="yes">Yes ❤️</button>
<button id="no">No 😅</button>

</div>

<script>
let noBtn=document.getElementById("no");
let yesBtn=document.getElementById("yes");

function moveNo(){
  noBtn.style.top=Math.random()*200-100+"px";
  noBtn.style.left=Math.random()*200-100+"px";
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);

yesBtn.onclick=function(){
  alert("Yay Mariam 😍❤️");
};

/* Floating hearts */
setInterval(()=>{
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💗";
  heart.style.left=Math.random()*100+"%";
  heart.style.fontSize=(Math.random()*20+20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
