<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mariam ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
  padding:20px;
}

.container{
  position:relative;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  padding:40px 30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  color:white;
  max-width:400px;
  width:100%;
}

h1{
  font-size:28px;
  margin-bottom:30px;
  animation:fadeIn 1.5s ease-in-out;
}

@media(min-width:600px){
  h1{font-size:38px;}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-30px);}
  to{opacity:1; transform:translateY(0);}
}

.buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  position:relative;
}

button{
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:all 0.3s ease;
  min-width:100px;
}

/* YES */
#yes{
  background:white;
  color:#ff4d6d;
  font-weight:600;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

#yes:hover{
  transform:scale(1.1);
}

/* NO */
#no{
  background:rgba(0,0,0,0.7);
  color:white;
  position:relative; /* changed from absolute */
}

.heart{
  position:absolute;
  font-size:24px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh) scale(0.5); opacity:1;}
  to{transform:translateY(-10vh) scale(1.2); opacity:0;}
}
</style>
</head>

<body>

<div class="container">
  <h1>Mariam 💖<br>Will you be my Valentine?</h1>
  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 😅</button>
  </div>
</div>

<script>
let noBtn=document.getElementById("no");
let yesBtn=document.getElementById("yes");

// Move NO but keep centered layout safe
function moveNo(){
  let x=(Math.random()*120)-60;
  let y=(Math.random()*60)-30;
  noBtn.style.transform=`translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);

yesBtn.onclick=function(){
  document.body.innerHTML=`
    <div style="height:100vh;display:flex;justify-content:center;align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;font-size:32px;font-weight:600;text-align:center;padding:20px;">
      Yay Mariam 😍❤️ <br> You just made me the happiest 💕
    </div>
  `;
};

// Floating hearts
setInterval(()=>{
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"%";
  heart.style.fontSize=(Math.random()*20+20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
